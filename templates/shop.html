{% extends "base.html" %}

{% block title %}Shop Popy Crunch{% endblock %}

{% block content %}
<section class="shop-page">
    <div class="container">
        <h1>Shop Popy Crunch</h1>
        <div class="products-grid shop-grid">
            {% for product in products %}
            <div class="product-card shop-card">
                <div class="product-image">
                    <img src="{{ url_for('static', filename='images/' + product.image) }}" alt="{{ product.name }}">
                </div>
                <div class="product-info">
                    <h3>{{ product.name }}</h3>
                    <p class="product-flavour">{{ product.flavour }}</p>
                    <p class="product-price">RM {{ "%.2f"|format(product.price) }}</p>
                    <p class="product-desc">{{ product.description }}</p>
                    <div class="quantity-selector">
                        <button class="qty-btn qty-minus" data-product-id="{{ product.id }}">-</button>
                        <input type="number" class="qty-input" id="qty-{{ product.id }}" value="1" min="1" max="99">
                        <button class="qty-btn qty-plus" data-product-id="{{ product.id }}">+</button>
                    </div>
                    <button class="btn btn-primary add-to-cart" data-product-id="{{ product.id }}">
                        ADD TO CART
                    </button>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</section>
{% endblock %}
